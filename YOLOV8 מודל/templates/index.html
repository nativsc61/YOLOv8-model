{% extends "base.html" %}

{% block title %}FRC Tracker - ראשי{% endblock %}

{% block content %}
<!-- Top Header: Stream Control + Compact Live Score -->
<div class="glass p-3 rounded-xl mb-4 flex flex-col md:flex-row items-center justify-between gap-3 border border-slate-800">
    <!-- Stream Input Bar -->
    <div class="flex items-center gap-2 w-full md:w-2/3">
        <input id="stream-url" type="text" placeholder="הכנס קישור יוטיוב או נתיב וידאו..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
        <button onclick="startStream()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-1.5 text-xs font-bold rounded transition whitespace-nowrap">טען וידאו</button>
    </div>

    <!-- Compact Scoreboard Indicator -->
    <div class="flex items-center gap-3 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 w-full md:w-auto justify-center">
        <div class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>
            <span class="text-xs font-bold text-red-400">RED:</span>
            <span id="red-score-display" class="text-base font-black text-red-500 font-mono">0</span>
        </div>
        <span class="text-xs font-bold text-slate-600">|</span>
        <div class="flex items-center gap-1.5">
            <span id="blue-score-display" class="text-base font-black text-blue-400 font-mono">0</span>
            <span class="text-xs font-bold text-blue-400">:BLUE</span>
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
        </div>
    </div>
</div>

<!-- Main Workspace: 2D Map (Dominant) + Video Calibration (Secondary) -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    
    <!-- 2D Map Window (Takes 2/3 of space) -->
    <div class="lg:col-span-2 glass p-3 rounded-xl flex flex-col items-center border border-emerald-900/40">
        <div class="flex items-center justify-between w-full mb-2 px-1">
            <span class="text-xs font-bold text-emerald-400 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                מפת דו-ממד בלייב (2D Map)
            </span>
            <span class="text-[10px] text-slate-400">גרור את הנקודות הירוקות לכיול המפה</span>
        </div>
        <div class="relative border border-slate-800 rounded overflow-hidden w-full aspect-[3/2] bg-slate-950 flex items-center justify-center shadow-2xl">
            <canvas id="map-canvas" width="600" height="400" class="block w-full h-full cursor-crosshair touch-none z-10"></canvas>
        </div>
    </div>

    <!-- Live Video Window (Takes 1/3 of space - Secondary) -->
    <div class="glass p-3 rounded-xl flex flex-col items-center border border-slate-800">
        <div class="flex items-center justify-between w-full mb-2 px-1">
            <span class="text-xs font-bold text-slate-400">וידאו עזר (כיול)</span>
            <span id="time-display" class="text-[11px] font-mono text-slate-400">00:00 / 00:00</span>
        </div>
        
        <div class="relative border border-slate-800 rounded overflow-hidden w-full aspect-[3/2] bg-black flex items-center justify-center">
            <img id="video-feed" src="" alt="Video Stream" class="w-full h-full object-contain block select-none pointer-events-none opacity-80">
            <canvas id="video-canvas" width="600" height="400" class="absolute top-0 left-0 cursor-crosshair w-full h-full touch-none z-10"></canvas>
        </div>

        <!-- Video Playback Controls -->
        <div class="w-full mt-3 bg-slate-900/80 p-2 rounded-lg flex items-center justify-center gap-1.5 border border-slate-800">
            <button onclick="controlAction('play')" class="text-xs bg-emerald-700 hover:bg-emerald-600 px-3 py-1 rounded transition">▶</button>
            <button onclick="controlAction('pause')" class="text-xs bg-amber-700 hover:bg-amber-600 px-3 py-1 rounded transition">⏸</button>
            <button onclick="controlAction('seek_back')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition text-slate-300">⏪ 10s</button>
            <button onclick="controlAction('seek_forward')" class="text-xs bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded transition text-slate-300">10s ⏩</button>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    const socket = io();
    const videoCanvas = document.getElementById('video-canvas');
    const videoCtx = videoCanvas.getContext('2d');
    const mapCanvas = document.getElementById('map-canvas');
    const mapCtx = mapCanvas.getContext('2d');
    const socketStatusEl = document.getElementById('socket-status');

    let latestObjects = [];
    
    // מצבי גרירה נפרדים
    let activeVideoDragIndex = -1;
    let activeMapDragIndex = -1;

    // נקודות התחלתיות לכיול עבור 2 המסכים
    let calibration = {
        video: [{x: 50, y: 50}, {x: 550, y: 50}, {x: 550, y: 350}, {x: 50, y: 350}],
        map: [{x: 30, y: 30}, {x: 570, y: 30}, {x: 570, y: 370}, {x: 30, y: 370}]
    };

    let mapImage = new Image();
    let isMapLoaded = false;
    mapImage.src = '/static/map.png';
    mapImage.onload = () => { isMapLoaded = true; drawMap(latestObjects); };

    // --- Socket.IO Status ---
    socket.on('connect', () => {
        if (socketStatusEl) {
            socketStatusEl.className = 'flex items-center gap-1.5 text-xs px-3 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full font-bold';
            socketStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> מחובר`;
        }
    });

    socket.on('disconnect', () => {
        if (socketStatusEl) {
            socketStatusEl.className = 'flex items-center gap-1.5 text-xs px-3 py-1 bg-red-950 text-red-400 border border-red-800 rounded-full font-bold';
            socketStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> מנותק`;
        }
    });

    socket.on('telemetry_update', function(data) {
        if (data.time) document.getElementById('time-display').innerText = data.time;
        
        // עדכון ניקוד בלייב
        if (data.scores) {
            const blueEl = document.getElementById('blue-score-display');
            const redEl = document.getElementById('red-score-display');
            if (blueEl) blueEl.innerText = data.scores.blue;
            if (redEl) redEl.innerText = data.scores.red;
        }

        if (data.objects) {
            latestObjects = data.objects;
            requestAnimationFrame(() => drawMap(latestObjects));
        }
    });

    function startStream() {
        const url = document.getElementById('stream-url').value.trim();
        if (!url) return;
        
        fetch('/api/start_stream', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ url: url })
        });
        
        const feedImg = document.getElementById('video-feed');
        feedImg.src = "/video_feed?" + new Date().getTime();
    }

    function controlAction(action) {
        fetch('/api/control', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ action: action })
        });
    }

    function sendCalibrationUpdate() {
        fetch('/api/update_calibration', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(calibration)
        });
    }

    // --- ציור מסך וידאו ---
    function drawVideoCanvas() {
        videoCtx.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
        
        videoCtx.beginPath();
        videoCtx.moveTo(calibration.video[0].x, calibration.video[0].y);
        for(let i = 1; i < 4; i++) {
            videoCtx.lineTo(calibration.video[i].x, calibration.video[i].y);
        }
        videoCtx.closePath();
        videoCtx.strokeStyle = 'rgba(234, 179, 8, 0.9)';
        videoCtx.lineWidth = 2;
        videoCtx.stroke();

        calibration.video.forEach((p, idx) => {
            videoCtx.beginPath();
            videoCtx.arc(p.x, p.y, 7, 0, Math.PI * 2);
            videoCtx.fillStyle = (idx === activeVideoDragIndex) ? '#ffffff' : '#eab308';
            videoCtx.fill();
            videoCtx.strokeStyle = '#000000';
            videoCtx.lineWidth = 1.5;
            videoCtx.stroke();
        });
    }

    // --- ציור מסך מפת 2D ---
    function drawMap(objects) {
        mapCtx.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
        if (isMapLoaded) {
            mapCtx.drawImage(mapImage, 0, 0, mapCanvas.width, mapCanvas.height);
        } else {
            mapCtx.fillStyle = '#0f172a';
            mapCtx.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
        }

        // ציור אובייקטים (רובוטים / כדורים)
        objects.forEach(obj => {
            if (['fuel', 'note', 'ball'].includes(obj.type)) {
                mapCtx.beginPath();
                mapCtx.arc(obj.x, obj.y, 5, 0, Math.PI * 2);
                mapCtx.fillStyle = '#facc15';
                mapCtx.fill();
            } else if (obj.type === 'robot') {
                mapCtx.fillStyle = obj.alliance === 'red' ? '#ef4444' : '#3b82f6';
                mapCtx.fillRect(obj.x - 10, obj.y - 10, 20, 20);
                if (obj.id) {
                    mapCtx.fillStyle = '#ffffff';
                    mapCtx.font = 'bold 10px monospace';
                    mapCtx.textAlign = 'center';
                    mapCtx.fillText(obj.id, obj.x, obj.y - 12);
                }
            }
        });

        // ציור מצולע ונקודות כיול של המפה (בירוק)
        mapCtx.beginPath();
        mapCtx.moveTo(calibration.map[0].x, calibration.map[0].y);
        for(let i = 1; i < 4; i++) {
            mapCtx.lineTo(calibration.map[i].x, calibration.map[i].y);
        }
        mapCtx.closePath();
        mapCtx.strokeStyle = 'rgba(16, 185, 129, 0.9)';
        mapCtx.lineWidth = 2;
        mapCtx.stroke();

        calibration.map.forEach((p, idx) => {
            mapCtx.beginPath();
            mapCtx.arc(p.x, p.y, 7, 0, Math.PI * 2);
            mapCtx.fillStyle = (idx === activeMapDragIndex) ? '#ffffff' : '#10b981';
            mapCtx.fill();
            mapCtx.strokeStyle = '#000000';
            mapCtx.lineWidth = 1.5;
            mapCtx.stroke();
        });
    }

    function getCanvasCoords(canvas, e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // --- אירועי עכבר / נגיעה עבור הווידאו ---
    videoCanvas.addEventListener('mousedown', (e) => {
        const pos = getCanvasCoords(videoCanvas, e);
        calibration.video.forEach((p, idx) => {
            if (Math.hypot(p.x - pos.x, p.y - pos.y) < 20) activeVideoDragIndex = idx;
        });
        if (activeVideoDragIndex !== -1) drawVideoCanvas();
    });

    // --- אירועי עכבר / נגיעה עבור המפה ---
    mapCanvas.addEventListener('mousedown', (e) => {
        const pos = getCanvasCoords(mapCanvas, e);
        calibration.map.forEach((p, idx) => {
            if (Math.hypot(p.x - pos.x, p.y - pos.y) < 20) activeMapDragIndex = idx;
        });
        if (activeMapDragIndex !== -1) drawMap(latestObjects);
    });

    // --- תנועת עכבר גלובלית ---
    window.addEventListener('mousemove', (e) => {
        if (activeVideoDragIndex !== -1) {
            const pos = getCanvasCoords(videoCanvas, e);
            calibration.video[activeVideoDragIndex] = {
                x: Math.max(0, Math.min(videoCanvas.width, pos.x)),
                y: Math.max(0, Math.min(videoCanvas.height, pos.y))
            };
            drawVideoCanvas();
        } else if (activeMapDragIndex !== -1) {
            const pos = getCanvasCoords(mapCanvas, e);
            calibration.map[activeMapDragIndex] = {
                x: Math.max(0, Math.min(mapCanvas.width, pos.x)),
                y: Math.max(0, Math.min(mapCanvas.height, pos.y))
            };
            drawMap(latestObjects);
        }
    });

    // --- שחרור עכבר גלובלי ---
    window.addEventListener('mouseup', () => {
        if (activeVideoDragIndex !== -1 || activeMapDragIndex !== -1) {
            activeVideoDragIndex = -1;
            activeMapDragIndex = -1;
            drawVideoCanvas();
            drawMap(latestObjects);
            sendCalibrationUpdate();
        }
    });

    drawVideoCanvas();
    drawMap([]);
</script>
{% endblock %}
